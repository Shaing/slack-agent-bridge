[project]
name = "cc-slack"
version = "0.1.0"
description = "Drive a local Claude Code install from Slack (Socket Mode bridge)"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "slack-bolt>=1.27",
    "aiohttp>=3.11",
    "claude-agent-sdk>=0.1.80",
]

[project.scripts]
cc-slack = "cc_slack.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cc_slack"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E701", "E702", "E731", "UP031"]  # compact test style
