# Slack app manifest for cc-slack.
# Create the app at https://api.slack.com/apps -> "Create New App" -> "From a manifest".
# Channel mode is ON: the bot answers @mentions in channels it is invited to (plus DMs).
# For DM-only, comment out the "channel mode" lines and set CC_ALLOW_CHANNELS=0.
display_information:
  name: aLLEN
  description: Drive a local Claude Code from Slack
  background_color: "#1f1f1f"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false # lets you type in the bot's DM
  bot_user:
    display_name: aLLEN
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:history
      - reactions:write
      - app_mentions:read
      - channels:history
      - groups:history
settings:
  event_subscriptions:
    bot_events:
      - message.im
      - app_mention
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
